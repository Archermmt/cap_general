type: genesis
paths:
  genesis_world_home: ~/Desktop/codes/genesis-world
verbose_level: warning
backend: cpu
show_viewer: true
sim_options:
  dt: 0.01
  substeps: 2
viewer_options:
  max_FPS: 60
  camera_pos:
  - 3.0
  - -2.0
  - 3.5
  camera_lookat:
  - 0.0
  - 0.0
  - 1.2
  camera_fov: 40
vis_options:
  rendered_envs_idx:
  - 0
rigid_options:
  dt: 0.01
  constraint_solver: Newton
  enable_collision: false
  enable_joint_limit: true
record_dir: ./outputs/genesis
export_dir: ./export/genesis
controls:
- name: drone
  alias: 七仔
  type: genesis_drone
  max_retry: 5
  reset_mode: per_exec
  record_execute: true
  horizon: 1000
  robot:
    type: genesis_drone
    video_fmt: mp4
    seed: 7
    reset_time: 0
    num_envs: 1
    visualize_target: true
    visualize_camera: false
    camera_enabled: true
    camera_res:
    - 320
    - 240
    camera_fov: 90.0
    camera_pos:
    - 0.12
    - 0.0
    - -0.03
    camera_lookat:
    - 1.0
    - 0.0
    - -0.03
    camera_up:
    - 0.0
    - 0.0
    - 1.0
    camera_near: 0.02
    camera_far: 20.0
    max_visualize_fps: 60
    base_init_pos:
    - 0.0
    - 0.0
    - 2.0
    max_episode_steps: null
    auto_reset: false
  policies:
    runner:
      type: base
      graph:
        name: runner
        nodes:
        - name: model
          type: model::rsl_rl
          config:
            ckpt_dir: ${paths.genesis_world_home}/examples/drone/logs/drone-hovering
            ckpt_step: -1
            obs_dim: 17
            action_dim: 4
            actor_cfg:
              class_name: MLPModel
              hidden_dims:
              - 128
              - 128
              activation: tanh
              distribution_cfg:
                class_name: GaussianDistribution
                init_std: 1.0
                std_type: scalar
            obs_groups:
              actor:
              - policy
              critic:
              - policy
  pipeline:
    jobs:
    - type: eval::genesis_eval
      config:
        epoch: 1
        stage: rl
        max_steps: 100
    - type: train::genesis_train
      config:
        stage: rl
        train_cfg:
          algorithm:
            class_name: PPO
            clip_param: 0.2
            desired_kl: 0.01
            entropy_coef: 0.004
            gamma: 0.99
            lam: 0.95
            learning_rate: 0.0003
            max_grad_norm: 1.0
            num_learning_epochs: 5
            num_mini_batches: 4
            schedule: adaptive
            use_clipped_value_loss: true
            value_loss_coef: 1.0
          actor:
            class_name: MLPModel
            hidden_dims:
            - 128
            - 128
            activation: tanh
            distribution_cfg:
              class_name: GaussianDistribution
              init_std: 1.0
              std_type: scalar
          critic:
            class_name: MLPModel
            hidden_dims:
            - 128
            - 128
            activation: tanh
          obs_groups:
            actor:
            - policy
            critic:
            - policy
          num_steps_per_env: 100
          save_interval: 100
          run_name: runner
          logger: tensorboard
server:
  cap_id: cap
  host: 127.0.0.1
  port: 8903
