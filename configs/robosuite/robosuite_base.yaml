type: base
paths:
  sam3_checkpoint_path: $YOUR_SAM3_CHECKPOINT_PATH
  contact_graspnet_root: $YOUR_CONTACT_GRASPNET_PATH
record_dir: ./outputs
controls:
  - name: robosuite
    alias:
      - cap
      - 七仔
    config:
      type: robosuite
      max_retry: 5
      reset_mode: never
      record_execute: true
      sam3_policy: sam3
      graspnet_policy: graspnet
      pyroki_policy: pyroki
      robot:
        type: robosuite
        controller_cfg: cap_general/frameworks/robosuite/robot/controllers/panda_joint_ctrl.json
        seed: 7
        reset_time: 0
        video_fmt: mp4
        image_keys:
          - robot0_robotview_image
        privileged: false
        enable_render: true
        viser_debug: false
        max_steps: 1500
      policies:
        sam3:
          type: base
          graph:
            name: sam3
            nodes:
              - name: model
                type: model::sam3
                config:
                  device: cuda
                  load_from_hf: false
                  checkpoint_path: ${paths.sam3_checkpoint_path}
                  confidence_threshold: 0.0
                  enable_inst_interactivity: true
        graspnet:
          type: base
          graph:
            name: graspnet
            nodes:
              - name: model
                type: model::graspnet
                config:
                  vendor_root: ${paths.contact_graspnet_root}
                  device: cuda
        pyroki:
          type: base
          graph:
            name: pyroki
            nodes:
              - name: model
                type: model::pyroki
                config:
                  robot_urdf_name: panda_description
                  target_link_name: panda_hand
server:
  cap_id: cap
  host: 127.0.0.1
  port: 8904
